[package]
name = "token-on-kindle"
version = "0.4.0"
description = "Codex and DeepSeek usage dashboard for Kindle"
authors = ["jnjnnjzch"]
edition = "2021"

[lib]
name = "token_on_kindle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
