name: Volcengine debug Windows

on:
  push:
    branches: [agent/volcengine-debug-probe-v097]
    paths:
      - '.github/workflows/volcengine-debug-windows.yml'
      - 'src-tauri/**'
      - 'web/**'
      - 'shared/**'
      - 'tests/**'
      - 'tools/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volcengine-debug-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows debug probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Run JavaScript tests
        run: npm test
      - name: Validate diagnostic composition
        run: npm run check:volcengine-debug
      - name: Build portable debug executable
        run: npm run build:volcengine-debug -- --no-bundle
      - name: Stage executable and instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item src-tauri/target/release/token-on-kindle.exe artifact/Token-on-Kindle-v0.9.7-Volcengine-Debug.exe
          Copy-Item docs/volcengine-debug.md artifact/使用说明.md
          Get-FileHash artifact/Token-on-Kindle-v0.9.7-Volcengine-Debug.exe -Algorithm SHA256 | Format-List | Out-File artifact/SHA256.txt -Encoding utf8
      - name: Upload Windows debug package
        uses: actions/upload-artifact@v4
        with:
          name: Token-on-Kindle-v0.9.7-Volcengine-Debug-Windows
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
