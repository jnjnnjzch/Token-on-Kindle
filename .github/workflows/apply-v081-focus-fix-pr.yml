name: Apply v0.8.1 focus fix from PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-v081-focus-fix-pr
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/deepseek-core-layout-v081' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deepseek-core-layout-v081
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply direct source fix
        run: |
          python3 tools/apply-v081-focus-fix.py
          node tools/sync-version.mjs v0.8.1
          npm test
      - name: Commit source and remove migration files
        run: |
          rm -f .github/workflows/apply-v081-focus-fix.yml
          rm -f .github/workflows/apply-v081-focus-fix-pr.yml
          rm -f tools/apply-v081-focus-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'prevent Windows background windows from stealing focus'
          git push origin HEAD:agent/deepseek-core-layout-v081
