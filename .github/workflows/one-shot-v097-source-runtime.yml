name: One-shot audited v0.9.7 source runtime

on:
  push:
    branches:
      - agent/fix-background-refresh-v097

permissions:
  contents: write

jobs:
  rewrite-test-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-background-refresh-v097
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply the audited source runtime rewrite
        run: |
          set -euo pipefail
          python3 tools/one-shot-v097-source-runtime.py
          python3 tools/one-shot-v097-runtime-hardening.py
          node tools/compose-extractor.mjs
          node tools/compose-extractor.mjs
          node tools/sync-version.mjs v0.9.7
          cargo fmt --manifest-path src-tauri/Cargo.toml
          rm -f package-lock.json
          rm -f tools/one-shot-v097-source-runtime.py
          rm -f tools/one-shot-v097-runtime-hardening.py
          rm -f .github/workflows/one-shot-v097-source-runtime.yml

      - name: Install JavaScript dependencies without changing repository locks
        run: npm install --no-package-lock

      - name: Run the complete JavaScript, parser, renderer, and repository suite
        id: javascript_suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/v097-npm-test.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve the complete failure set without product changes
        if: steps.javascript_suite.outputs.exit_code != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cp /tmp/v097-npm-test.log diagnostics/v097-npm-test.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diagnostics/v097-npm-test.log
          git commit -m "diagnostics: capture v0.9.7 npm failures [skip ci]"
          git push origin HEAD:agent/fix-background-refresh-v097

      - name: Stop after diagnostic capture
        if: steps.javascript_suite.outputs.exit_code != '0'
        run: exit 1

      - name: Install Tauri Linux system dependencies
        if: steps.javascript_suite.outputs.exit_code == '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Validate Rust formatting, runtime unit tests, and compilation
        if: steps.javascript_suite.outputs.exit_code == '0'
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Commit only the fully validated repository state
        if: steps.javascript_suite.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git diff --check
          test ! -e tools/one-shot-v097-source-runtime.py
          test ! -e tools/one-shot-v097-runtime-hardening.py
          test ! -e .github/workflows/one-shot-v097-source-runtime.yml
          test ! -e package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.9.7: harden autonomous source refresh"
          git push origin HEAD:agent/fix-background-refresh-v097
