name: Apply v0.9.1 title bridge restoration

on:
  push:
    branches:
      - agent/v0.9.1-restore-title-bridge

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.9.1-restore-title-bridge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore proven title bridge
        run: |
          python3 tools/apply-v091-title-bridge.py
          node tools/compose-volcengine-model-list.mjs
          node tools/compose-extractor.mjs
          node tools/check-version-sync.mjs
          npm test
      - name: Commit restoration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v0.9.1: restore the proven title bridge"
          git push origin HEAD:agent/v0.9.1-restore-title-bridge
