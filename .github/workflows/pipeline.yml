name: Build and release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    name: Generate v0.6.0 maintenance sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release sources
        run: python3 tools/generate-v0.6.0.py
      - name: Commit generated sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v0.6.0: automatic updater, concise diagnostics, repository cleanup, and UI refresh'
          git push origin HEAD:${GITHUB_HEAD_REF:-feat/v0.6.0-maintenance}
