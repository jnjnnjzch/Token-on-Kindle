name: One-shot v0.9.5 final stability fix

on:
  push:
    branches:
      - agent/fix-long-running-sync-v095

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-long-running-sync-v095
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply final product patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/one-shot-v095-final.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('# Hidden native WebViews')
          end = text.index('# Update legacy tests', start)
          path.write_text(text[:start] + text[end:], encoding='utf-8')
          PY
          python3 tools/one-shot-v095-final.py
          python3 tools/one-shot-v095-format-tests.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          reader = Path('web/volcengine-chart-reader.js')
          text = reader.read_text(encoding='utf-8')
          text, count = re.subn(
              r'\n\s*const rect = control\.getBoundingClientRect\(\);\n\s*if \(!rect\.width \|\| !rect\.height\) continue;',
              '\n        if (!control.isConnected) continue;',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('hidden Volcengine control guard changed')
          reader.write_text(text, encoding='utf-8')

          test = Path('tests/long-running-sync-v095.test.mjs')
          text = test.read_text(encoding='utf-8')
          anchor = "    assert.match(reader, /function triggerDataRefresh\\(\\)/);\n"
          if text.count(anchor) != 1:
              raise SystemExit('long-running sync test anchor changed')
          text = text.replace(
              anchor,
              anchor + "    assert.match(reader, /if \\(!control\\.isConnected\\) continue/);\n",
              1,
          )
          test.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          lines = readme.read_text(encoding='utf-8').splitlines()
          readme.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8')
          PY
          node tools/compose-extractor.mjs
          node tools/compose-extractor.mjs
          node tools/sync-version.mjs v0.9.5
          cargo fmt --manifest-path src-tauri/Cargo.toml
          rm -f package-lock.json
          rm -f tools/one-shot-v095-final.py
          rm -f tools/one-shot-v095-format-tests.py
          rm -f .github/workflows/one-shot-v095-long-running-sync.yml
          rm -f .github/workflows/one-shot-v095-retry.yml
          rm -f .github/workflows/one-shot-v095-final.yml

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run complete JavaScript test suite
        run: npm test

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Validate Rust formatting and compile
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git status --short
          git add -A
          git commit -m "v0.9.5: harden long-running synchronization"
          git push origin HEAD:agent/fix-long-running-sync-v095
