name: One-shot v0.9.5 final stability fix

on:
  push:
    branches:
      - agent/fix-long-running-sync-v095

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-long-running-sync-v095
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply final product patch
        run: |
          python3 tools/one-shot-v095-final.py
          node tools/compose-extractor.mjs
          node tools/compose-extractor.mjs
          node tools/sync-version.mjs v0.9.5
          cargo fmt --manifest-path src-tauri/Cargo.toml
          rm -f package-lock.json
          rm -f tools/one-shot-v095-final.py
          rm -f .github/workflows/one-shot-v095-long-running-sync.yml
          rm -f .github/workflows/one-shot-v095-retry.yml
          rm -f .github/workflows/one-shot-v095-final.yml

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run complete JavaScript test suite
        run: npm test

      - name: Validate Rust formatting and compile
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git status --short
          git add -A
          git commit -m "v0.9.5: harden long-running synchronization"
          git push origin HEAD:agent/fix-long-running-sync-v095
