name: Apply v0.9.0 navigation bridge patch

on:
  push:
    branches:
      - agent/v0.9.0-navigation-bridge

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.9.0-navigation-bridge
          fetch-depth: 0
      - name: Apply bridge patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          path = Path('tools/apply-v090-navigation-bridge.py')
          text = path.read_text()
          start = text.index('title_line = "    document.title')
          end = text.index('\ndeepseek_line =', start)
          corrected = dedent('''
          canonical_signal_marker = ''' + '"''"' + '''canonical = canonical.replace(
            'hide.onclick = () => window.close();',
          ''' + '"''"' + ''')
          assert canonical_signal_marker in text, "canonical replacement chain changed"
          canonical_signal_replace = ''' + '"''"' + '''canonical = canonical.replace(
            "document.title = `__TOKEN_ON_KINDLE__:${source}:${encoded}`;",
            "document.title = `__TOKEN_ON_KINDLE__:${source}:${encoded}`;\\n    window.__TOKEN_ON_KINDLE_NAVIGATE_BRIDGE__?.('signal', source, encoded);"
          );
          ''' + '"''"' + '''
          text = text.replace(canonical_signal_marker, canonical_signal_replace + canonical_signal_marker, 1)

          old_hide_output = "  hide.onclick = () => { document.title = '__TOKEN_ON_KINDLE_ACTION__:dashboard'; };"
          new_hide_output = "  hide.onclick = () => {\\n    document.title = '__TOKEN_ON_KINDLE_ACTION__:dashboard';\\n    window.__TOKEN_ON_KINDLE_NAVIGATE_BRIDGE__?.('action', 'dashboard');\\n  };"
          hide_compose_marker = "  \\\"hide.onclick = () => { document.title = '__TOKEN_ON_KINDLE_ACTION__:dashboard'; };\\\""
          assert hide_compose_marker in text, "source hide compose output changed"
          text = text.replace(hide_compose_marker, "  " + repr(new_hide_output), 1)
          ''').lstrip()
          path.write_text(text[:start] + corrected + text[end:])
          PY
          python3 tools/apply-v090-navigation-bridge.py
          node tools/compose-volcengine-model-list.mjs
          node tools/compose-extractor.mjs
          node tools/check-version-sync.mjs
          node --test tests/navigation-bridge-v090.test.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v0.9.0: replace title-only source bridge"
          git push origin HEAD:agent/v0.9.0-navigation-bridge
