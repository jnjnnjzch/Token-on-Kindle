name: Apply v0.9.0 navigation bridge patch

on:
  push:
    branches:
      - agent/v0.9.0-navigation-bridge

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.9.0-navigation-bridge
          fetch-depth: 0
      - name: Apply bridge patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply-v090-navigation-bridge.py')
          text = path.read_text()
          old = """    const path = kind === 'signal'
                ? `/signal/${encodeURIComponent(value)}/${encoded}`
                : `/action/${encodeURIComponent(value)}`;
              const url = `${BRIDGE_ORIGIN}${path}?nonce=${Date.now()}-${++bridgeSequence}`;"""
          new = """    const path = kind === 'signal'
                ? '/signal/' + encodeURIComponent(value) + '/' + encoded
                : '/action/' + encodeURIComponent(value);
              const url = BRIDGE_ORIGIN + path + '?nonce=' + Date.now() + '-' + (++bridgeSequence);"""
          assert old in text, 'navigation bridge bootstrap shape changed'
          path.write_text(text.replace(old, new, 1))
          PY
          python3 tools/apply-v090-navigation-bridge.py
          node tools/compose-volcengine-model-list.mjs
          node tools/compose-extractor.mjs
          node tools/check-version-sync.mjs
          node --test tests/navigation-bridge-v090.test.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v0.9.0: replace title-only source bridge"
          git push origin HEAD:agent/v0.9.0-navigation-bridge
