name: Apply Kindle profile patch

on:
  push:
    branches:
      - feat/android-kindle-profiles
    paths:
      - tools/patch_kindles_profiles.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-kindle-profiles
      - name: Apply exact Rust source patch
        run: python tools/patch_kindles_profiles.py
      - name: Commit patched Rust file
        shell: bash
        run: |
          if git diff --quiet -- src-tauri/src/lib.rs; then
            echo 'No Rust changes were produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/lib.rs
          git commit -m 'Support native Kindle PNG dimensions [skip ci]'
          git push origin HEAD:feat/android-kindle-profiles
