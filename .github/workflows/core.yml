name: Core tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run parser and PNG tests
        run: npm test
      - name: Check frontend syntax
        run: |
          node --check web/app.js
          node --check web/extractor.js
          node --check web/core.mjs
