name: Core tests

on:
  push:
  pull_request:

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run parser, PNG, and JavaScript checks
        run: npm test
      - name: Install Lua 5.1 syntax checker
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check KOReader plugin syntax
        run: |
          luac5.1 -p koreader/tokenonkindle.koplugin/main.lua
          luac5.1 -p koreader/tokenonkindle.koplugin/_meta.lua
