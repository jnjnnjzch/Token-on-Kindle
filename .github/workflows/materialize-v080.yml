name: Materialize v0.8.0 source

on:
  push:
    branches: [agent/v080-source-rebuild]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v080-source-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize real source files
        run: node tools/materialize-v080.mjs
      - name: Remove one-time staging files
        run: rm -f tools/v080-packed.part* tools/materialize-v080.mjs .github/workflows/materialize-v080.yml
      - name: Validate materialized source
        run: npm test
      - name: Commit real source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'materialize v0.8.0 source [materialized-v080]'
          git push origin HEAD:agent/v080-source-rebuild
