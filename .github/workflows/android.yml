name: Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'web/**'
      - 'shared/**'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: npm install

      - name: Run shared tests
        run: npm test

      - name: Initialize Android project
        run: npm run tauri android init -- --ci

      - name: Build installable arm64 debug APK
        run: npm run tauri android build -- --debug --apk --target aarch64

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*debug*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" release/Token-on-Kindle-android-arm64-debug.apk
          sha256sum release/Token-on-Kindle-android-arm64-debug.apk > release/Token-on-Kindle-android-arm64-debug.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Token-on-Kindle-android-arm64-debug
          path: release/*
          if-no-files-found: error
