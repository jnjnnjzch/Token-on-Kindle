# deterministic retry 6
name: One-shot v0.9.3 Volcengine verified

on:
  push:
    branches:
      - agent/v0.9.3-volcengine-today-kindle7
    paths:
      - .github/workflows/one-shot-v093-volcengine-2.yml

permissions:
  contents: write

jobs:
  patch-test-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.9.3-volcengine-today-kindle7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        shell: bash
        run: |
          python3 tools/one-shot-v093-patch.py
          python3 - <<'PY'
          from pathlib import Path
          renderer = Path('web/kindle-renderer.js')
          source = renderer.read_text()
          old_heights = "return sources.map(source => ({ codex: 120, deepseek: 294, volcengine: 150 })[source]);"
          new_heights = "return sources.map(source => ({ codex: 132, deepseek: 294, volcengine: 150 })[source]);"
          assert source.count(old_heights) == 1, source.count(old_heights)
          source = source.replace(old_heights, new_heights, 1)
          assert source.count('  const gap = 10;') == 1, source.count('  const gap = 10;')
          source = source.replace('  const gap = 10;', '  const gap = sources.length === 3 ? 4 : 10;', 1)
          renderer.write_text(source)

          for filename in ['tests/volcengine-model-usage-v083.test.mjs', 'tests/volcengine-today-display-v093.test.mjs']:
              path = Path(filename)
              text = path.read_text().replace('[120, 294, 150]', '[132, 294, 150]')
              path.write_text(text)
          PY
          cat > tools/compose-volcengine-model-list.mjs <<'MJS'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = path.resolve(import.meta.dirname, '..');
          const rendererPath = path.join(root, 'web', 'kindle-renderer.js');
          const marker = '/* TOKEN-ON-KINDLE VOLCENGINE TEXT MODEL LIST */';
          let source = fs.readFileSync(rendererPath, 'utf8').replaceAll('\r\n', '\n');

          function replaceBlock(input, startMarker, endMarker, replacement, label) {
            const start = input.indexOf(startMarker);
            if (start < 0) throw new Error(`${label} start marker changed`);
            const end = input.indexOf(endMarker, start);
            if (end < 0) throw new Error(`${label} end marker changed`);
            return `${input.slice(0, start)}${replacement.trimEnd()}\n\n${input.slice(end)}`;
          }

          const layout = `export function volcengineModelLayoutPlan(boxHeight, modelCount) {
            const count = Math.max(0, Number(modelCount) || 0);
            if (!count) return { hasModels: false, quotaHeight: Math.max(0, boxHeight - 45), columns: 0, rows: 0, capacity: 0, visibleCount: 0, overflowCount: 0, rowHeight: 0, fontSize: 0 };
            const compact = boxHeight < 220;
            const medium = boxHeight < 340;
            const quotaHeight = compact ? 44 : medium ? 60 : 92;
            const sectionGap = compact ? 5 : medium ? 7 : 10;
            const modelHeaderHeight = compact ? 14 : 17;
            const modelAreaHeight = Math.max(28, boxHeight - 39 - quotaHeight - sectionGap - 8);
            const columns = count === 1
              ? 1
              : compact
                ? (count <= 2 ? 1 : 2)
                : (count <= 4 ? 2 : count <= 9 ? 3 : 4);
            const rows = Math.max(1, Math.ceil(count / columns));
            const rowHeight = Math.max(8.5, (modelAreaHeight - modelHeaderHeight) / rows);
            const fontSize = clamp(rowHeight - 1, 8.5, compact ? 10.5 : 12);
            return {
              hasModels: true,
              compact,
              medium,
              quotaHeight,
              sectionGap,
              modelHeaderHeight,
              modelAreaHeight,
              columns,
              rows,
              rowHeight,
              fontSize,
              capacity: count,
              visibleCount: count,
              overflowCount: 0
            };
          }`;

          const textList = `${marker}
          function drawVolcengineModels(ctx, models, box, y, height, plan) {
            drawText(ctx, '今日模型 TOKEN', box.x + 12, y, plan.compact ? 9.5 : 11, 850, 'left', PALETTE.ink);
            drawText(ctx, '今日调用 ' + models.length + ' 个', box.x + box.width - 12, y + 0.5, plan.compact ? 8.5 : 10, 750, 'right', PALETTE.dark);
            const gridY = y + plan.modelHeaderHeight;
            const gridWidth = box.width - 24;
            const columnGap = plan.compact ? 20 : 22;
            const columnWidth = (gridWidth - columnGap * (plan.columns - 1)) / plan.columns;
            const nameSize = plan.fontSize;
            const tokenSize = Math.min(plan.fontSize + 1, plan.compact ? 11.5 : 13);
            const tokenReserve = plan.compact ? 62 : 72;
            const maxNameLength = Math.max(8, Math.floor((columnWidth - tokenReserve) / Math.max(4.7, nameSize * 0.56)));

            models.forEach((model, index) => {
              const column = index % plan.columns;
              const row = Math.floor(index / plan.columns);
              const left = box.x + 12 + column * (columnWidth + columnGap);
              const top = gridY + row * plan.rowHeight;
              if (row > 0) drawLine(ctx, left, top - 1, left + columnWidth, top - 1, 0.8, PALETTE.light);
              const textY = top + Math.max(0, (plan.rowHeight - nameSize) / 2);
              drawText(ctx, shorten(model.name, maxNameLength), left, textY, nameSize, 750, 'left', PALETTE.ink);
              drawText(ctx, formatTokens(model.latestTokens), left + columnWidth, textY - 0.5, tokenSize, 900, 'right', PALETTE.ink);
            });
          }`;

          source = replaceBlock(source, 'export function volcengineModelLayoutPlan(boxHeight, modelCount) {', 'function drawVolcengineQuotaStrip(ctx, windows, box, y, height) {', layout, 'Volcengine layout');
          source = replaceBlock(source, marker, 'function drawVolcengine(ctx, volcengine, box) {', textList, 'Volcengine model list');

          if (!source.includes("drawText(ctx, '今日模型 TOKEN'")) throw new Error('Volcengine today heading missing');
          if (!source.includes("'今日调用 ' + models.length + ' 个'")) throw new Error('Volcengine today count missing');
          if (!source.includes('formatTokens(model.latestTokens)')) throw new Error('Volcengine latest token value missing');
          fs.writeFileSync(rendererPath, source);
          console.log('Composed today-only Volcengine model list for Kindle 7');
          MJS
          node tools/sync-version.mjs 0.9.3
          node tools/compose-volcengine-model-list.mjs
          node tools/compose-volcengine-model-list.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run full test suite in clean repository shape
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-v093-volcengine.yml .github/workflows/one-shot-v093-volcengine-2.yml
          npm test
      - name: Render real 600x800 Kindle 7 preview
        shell: bash
        run: |
          mkdir -p .tmp-preview
          cat > .tmp-preview/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:600px;height:800px;overflow:hidden;background:white}canvas{display:block}</style></head><body>
          <canvas id="preview" width="600" height="800"></canvas>
          <script type="module">
          import { renderKindleDashboard } from '../web/kindle-renderer.js';
          const ctx = document.querySelector('#preview').getContext('2d');
          renderKindleDashboard(ctx, {
            displaySources: { codex: true, deepseek: true, volcengine: true },
            codex: { capturedAt: new Date().toISOString(), quotas: [
              { id: 'weekly', remainingPercent: 72, usedPercent: 28, resetText: '5天后重置' },
              { id: '5h', remainingPercent: 91, usedPercent: 9, resetText: '3小时后重置' }
            ] },
            deepseek: { balance: 86.4, todayCost: 3.21, todayTokens: 2380000, account: { cumulativeCost: 52.5, monthlyCost: 18.2, monthlyTokens: 14500000 }, models: {
              flash: { tokens: 950000, cost: 0.88, cacheMissTokens: 180000, cacheHitTokens: 690000, outputTokens: 80000, cacheRate: 79.3 },
              pro: { tokens: 1430000, cost: 2.33, cacheMissTokens: 310000, cacheHitTokens: 960000, outputTokens: 160000, cacheRate: 75.6 }
            } },
            volcengine: { windows: [
              { id: '5h', label: '近5小时用量', used: 320, total: 4000, usedPercent: 8 },
              { id: 'weekly', label: '近一周用量', used: 2410, total: 14000, usedPercent: 17.2 },
              { id: 'monthly', label: '近一月用量', used: 6830, total: 42000, usedPercent: 16.3 }
            ], models: [
              { name: 'deepseek-v4-pro', totalTokens: 8500000, latestTokens: 680000 },
              { name: 'doubao-seed-1.6', totalTokens: 6200000, latestTokens: 410000 },
              { name: 'kimi-k2.6', totalTokens: 5400000, latestTokens: 225000 },
              { name: 'glm-5.2', totalTokens: 3100000, latestTokens: 88000 },
              { name: 'monthly-only-hidden', totalTokens: 9900000, latestTokens: 0 }
            ] }
          });
          </script></body></html>
          HTML
          python3 -m http.server 8765 >/tmp/token-preview-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          "$browser" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=600,800 --screenshot="$PWD/.tmp-preview/kindle7-v093.png" http://127.0.0.1:8765/.tmp-preview/index.html
          python3 - <<'PY'
          from pathlib import Path
          import struct
          image = Path('.tmp-preview/kindle7-v093.png').read_bytes()
          assert image[:8] == b'\x89PNG\r\n\x1a\n'
          width, height = struct.unpack('>II', image[16:24])
          assert (width, height) == (600, 800), (width, height)
          assert len(image) > 12000, len(image)
          print(f'preview={width}x{height}, bytes={len(image)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kindle7-volcengine-v093-preview
          path: .tmp-preview/kindle7-v093.png
      - name: Commit verified product changes
        shell: bash
        run: |
          rm -rf .tmp-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json web/version.js web/kindle-renderer.js tools/compose-volcengine-model-list.mjs tests/volcengine-model-usage-v083.test.mjs tests/volcengine-today-display-v093.test.mjs
          git commit -m "v0.9.3: show today's Volcengine models clearly"
          git push origin HEAD:agent/v0.9.3-volcengine-today-kindle7
