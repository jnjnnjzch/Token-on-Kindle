name: One-shot Volcengine debug Windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-volcengine-debug-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-shot-volcengine-debug-windows
  cancel-in-progress: true

jobs:
  build:
    name: Build v0.9.7 Windows diagnostic EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/volcengine-debug-probe-v097
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Validate diagnostic composition
        run: npm run check:volcengine-debug
      - name: Build portable Windows diagnostic executable
        run: npm run build:volcengine-debug -- --no-bundle
      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item src-tauri/target/release/token-on-kindle.exe artifact/Token-on-Kindle-v0.9.7-Volcengine-Debug.exe
          Copy-Item docs/volcengine-debug.md artifact/使用说明.md
          $hash = (Get-FileHash artifact/Token-on-Kindle-v0.9.7-Volcengine-Debug.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Token-on-Kindle-v0.9.7-Volcengine-Debug.exe" | Out-File artifact/SHA256.txt -Encoding ascii
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Token-on-Kindle-v0.9.7-Volcengine-Debug-Windows
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
