name: Apply Android-safe imports once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-import-pr.yml'
      - 'tools/patch_mobile_imports.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/android-kindle-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - run: python tools/patch_mobile_imports.py
      - name: Commit Android-safe imports to the PR branch
        shell: bash
        run: |
          test -n "$(git status --short src-tauri/src/lib.rs)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/lib.rs
          git commit -m 'Gate tray imports to desktop targets'
          git push origin HEAD:${{ github.head_ref }}
