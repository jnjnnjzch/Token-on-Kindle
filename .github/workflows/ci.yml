name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'src-tauri/**'
      - 'web/**'
      - 'shared/**'
      - 'tests/**'
      - 'tools/**'
      - 'koreader/**'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'src-tauri/**'
      - 'web/**'
      - 'shared/**'
      - 'tests/**'
      - 'tools/**'
      - 'koreader/**'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Core and frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run parser, PNG, renderer, and JavaScript checks
        run: npm test
      - name: Install Lua 5.1 syntax checker
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check KOReader plugin syntax
        run: |
          luac5.1 -p koreader/tokenonkindle.koplugin/main.lua
          luac5.1 -p koreader/tokenonkindle.koplugin/_meta.lua

  windows-portable:
    name: Windows portable EXE
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend CLI
        run: npm install
      - name: Build portable executable
        run: npm run build -- --no-bundle
      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item src-tauri/target/release/token-on-kindle.exe artifact/Token-on-Kindle.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Token-on-Kindle-windows-portable
          path: artifact/Token-on-Kindle.exe
          if-no-files-found: error
