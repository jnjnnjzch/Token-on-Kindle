name: One-shot v0.9.4 deterministic Volcengine verification

on:
  push:
    branches:
      - agent/v0.9.4-preserve-volcengine-view

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.9.4-preserve-volcengine-view
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply source-specific refresh fix
        run: |
          python3 tools/one-shot-v094-preserve-view.py
          node tools/sync-version.mjs v0.9.4
          rm tools/one-shot-v094-preserve-view.py
          rm .github/workflows/one-shot-v094-preserve-volcengine-4.yml

      - name: Install dependencies
        run: npm install

      - name: Run complete JavaScript suite
        run: npm test

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.9.4: preserve the selected Volcengine enterprise view"
          git push origin HEAD:agent/v0.9.4-preserve-volcengine-view
