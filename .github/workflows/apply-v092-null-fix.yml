name: Apply verified null-render fix

on:
  push:
    branches:
      - "agent/v0.9.2-fix-null-source-render"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "agent/v0.9.2-fix-null-source-render"
      - name: Apply verified product patch
        run: python tools/apply-v092-null-fix.py
      - name: Run focused regression test
        run: node --test tests/kindle-renderer.test.mjs
      - name: Commit verified product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/kindle-renderer.js tests/kindle-renderer.test.mjs
          git diff --cached --check
          git commit -m "fix: keep control center alive with empty source state"
          git push origin HEAD:agent/v0.9.2-fix-null-source-render
