name: One-time branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale merged and superseded branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'agent/windows-build-validation'
            'feat/android-kindle-profiles'
            'feat/updater-multiplatform-koreader'
            'fix/deepseek-and-kindle-layout'
            'fix/v0.4.1-cache-bars'
            'fix/windows-webview-deadlock'
            'hotfix/deepseek-response-capture-v031-validation'
            'hotfix/deepseek-response-capture-v031'
            'agent/http-browser-refresh-settings'
          )
          for branch in "${branches[@]}"; do
            echo "Deleting $branch if it exists"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
          done
