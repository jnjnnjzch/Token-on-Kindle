name: Prepare v0.9.9 metadata

on:
  push:
    branches: [release/v0.9.9]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.9.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize version metadata
        run: node tools/sync-version.mjs v0.9.9
      - name: Commit version metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json web/version.js
          git commit -m "release: prepare v0.9.9"
          git push origin HEAD:release/v0.9.9
