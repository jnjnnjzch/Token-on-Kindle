name: Publish v0.5.0 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.5.0-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8829181490/zip" \
            > windows-artifact.zip
          mkdir -p package/Token-on-Kindle-v0.5.0-windows-x64 release
          unzip -q windows-artifact.zip -d package/Token-on-Kindle-v0.5.0-windows-x64
          cp README.md package/Token-on-Kindle-v0.5.0-windows-x64/README.md
          chmod +x package/Token-on-Kindle-v0.5.0-windows-x64/Token-on-Kindle.exe || true
          cd package
          zip -r ../release/Token-on-Kindle-v0.5.0-windows-x64.zip Token-on-Kindle-v0.5.0-windows-x64
          cd ../release
          sha256sum Token-on-Kindle-v0.5.0-windows-x64.zip > Token-on-Kindle-v0.5.0-SHA256SUMS.txt

      - name: Create official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          name: Token on Kindle v0.5.0
          target_commitish: main
          generate_release_notes: true
          files: |
            release/Token-on-Kindle-v0.5.0-windows-x64.zip
            release/Token-on-Kindle-v0.5.0-SHA256SUMS.txt
