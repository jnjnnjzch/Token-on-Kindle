name: Apply mobile extractor patch

on:
  push:
    branches:
      - feat/android-kindle-profiles
    paths:
      - tools/patch_mobile_extractor.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-kindle-profiles
      - run: python tools/patch_mobile_extractor.py
      - name: Commit patched Rust file
        shell: bash
        run: |
          test -n "$(git status --short src-tauri/src/lib.rs)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/lib.rs
          git commit -m 'Enable mobile WebView usage extraction [skip ci]'
          git push origin HEAD:feat/android-kindle-profiles
